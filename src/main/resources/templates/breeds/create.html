<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Create Breed')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Create Breed')}"></div>
<main class="container page-content">
    <div class="form-card">
        <form class="form-grid" th:action="@{/breeds/create}" method="post">
            <div class="form-row">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" required>
            </div>
            <div class="form-row">
                <label for="description">Description</label>
                <input id="description" type="text" name="description">
            </div>
            <div class="form-actions">
                <a class="button secondary" th:href="@{/breeds}">Назад</a>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
