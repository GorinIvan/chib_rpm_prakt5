<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Order Items')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Order Items')}"></div>
<main class="container page-content">
    <div class="page-actions">
        <a class="button" th:href="@{/order-items/create}">Добавить Order Item</a>
    </div>
    <div class="table-card">
        <table>
            <thead>
            <tr><th>ID</th><th>Order</th><th>Cat</th><th>Quantity</th><th>Price at purchase</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${orderItems}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.order != null ? 'Order #' + item.order.id : ''}"></td>
                <td th:text="${item.cat != null ? item.cat.name : ''}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.priceAtPurchase}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
