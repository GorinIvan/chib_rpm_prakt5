<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Carts')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Carts')}"></div>
<main class="container page-content">
    <div class="page-actions">
        <a class="button" th:href="@{/carts/create}">Добавить Cart</a>
    </div>
    <div class="table-card">
        <table>
            <thead>
            <tr><th>ID</th><th>Created at</th><th>Updated at</th></tr>
            </thead>
            <tbody>
            <tr th:each="cart : ${carts}">
                <td th:text="${cart.id}"></td>
                <td th:text="${cart.createdAt}"></td>
                <td th:text="${cart.updatedAt}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
