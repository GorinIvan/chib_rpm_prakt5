<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Create Cart')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Create Cart')}"></div>
<main class="container page-content">
    <div class="form-card">
        <form class="form-grid" th:action="@{/carts/create}" method="post">
            <div class="form-row">
                <label for="userId">Owner</label>
                <select id="userId" name="userId" required>
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                </select>
            </div>
            <div class="form-row">
                <label for="createdAt">Created at</label>
                <input id="createdAt" type="datetime-local" name="createdAt">
            </div>
            <div class="form-row">
                <label for="updatedAt">Updated at</label>
                <input id="updatedAt" type="datetime-local" name="updatedAt">
            </div>
            <div class="form-actions">
                <a class="button secondary" th:href="@{/carts}">Назад</a>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
