<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Orders</title></head>
<body>
<h1>Orders</h1>
<a th:href="@{/}">На главную</a> | <a th:href="@{/orders/create}">Добавить Order</a>
<table border="1">
    <tr><th>ID</th><th>User</th><th>Status</th><th>Total</th><th>Order date</th><th>Payment method</th><th>Payment status</th></tr>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.user != null ? order.user.username : ''}"></td>
        <td th:text="${order.orderStatus}"></td>
        <td th:text="${order.totalAmount}"></td>
        <td th:text="${order.orderDate}"></td>
        <td th:text="${order.paymentMethod}"></td>
        <td th:text="${order.paymentStatus}"></td>
    </tr>
</table>
</body>
</html>
