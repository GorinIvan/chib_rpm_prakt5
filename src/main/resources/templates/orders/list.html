<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Orders')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Orders')}"></div>
<main class="container page-content">
    <div class="page-actions">
        <a class="button" th:href="@{/orders/create}">Добавить Order</a>
    </div>
    <div class="table-card">
        <table>
            <thead>
            <tr><th>ID</th><th>Status</th><th>Total</th><th>Order date</th><th>Payment method</th><th>Payment status</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.orderStatus}"></td>
                <td th:text="${order.totalAmount}"></td>
                <td th:text="${order.orderDate}"></td>
                <td th:text="${order.paymentMethod}"></td>
                <td th:text="${order.paymentStatus}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
