<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Create Order</title></head>
<body>
<h1>Create Order</h1>
<a th:href="@{/orders}">Назад</a>
<form th:action="@{/orders/create}" method="post">
    <div>User:
        <select name="userId" required>
            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
        </select>
    </div>
    <div>Order status: <input type="text" name="orderStatus"></div>
    <div>Total amount: <input type="number" step="0.01" name="totalAmount"></div>
    <div>Order date: <input type="datetime-local" name="orderDate"></div>
    <div>Payment method: <input type="text" name="paymentMethod"></div>
    <div>Payment status: <input type="text" name="paymentStatus"></div>
    <button type="submit">Save</button>
</form>
</body>
</html>
