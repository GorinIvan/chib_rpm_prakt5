<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Create Cat</title></head>
<body>
<h1>Create Cat</h1>
<a th:href="@{/cats}">Назад</a>
<form th:action="@{/cats/create}" method="post">
    <div>Name: <input type="text" name="name" required></div>
    <div>Birth date: <input type="date" name="birthDate"></div>
    <div>Color: <input type="text" name="color"></div>
    <div>Pedigree: <input type="text" name="pedigree"></div>
    <div>Price: <input type="number" step="0.01" name="price"></div>
    <div>Status: <input type="text" name="status"></div>
    <div>Breed:
        <select name="breedId" required>
            <option th:each="breed : ${breeds}" th:value="${breed.id}" th:text="${breed.name}"></option>
        </select>
    </div>
    <button type="submit">Save</button>
</form>
</body>
</html>
