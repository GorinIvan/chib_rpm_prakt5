<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Cats')}"></head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Cats')}"></div>
<main class="container page-content">
    <div class="page-actions">
        <a class="button" th:href="@{/cats/create}">Добавить Cat</a>
    </div>
    <div class="table-card">
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Birth date</th><th>Color</th><th>Pedigree</th><th>Price</th><th>Status</th><th>Breed</th></tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${cats}">
                <td th:text="${cat.id}"></td>
                <td th:text="${cat.name}"></td>
                <td th:text="${cat.birthDate}"></td>
                <td th:text="${cat.color}"></td>
                <td th:text="${cat.pedigree}"></td>
                <td th:text="${cat.price}"></td>
                <td th:text="${cat.status}"></td>
                <td th:text="${cat.breed != null ? cat.breed.name : ''}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: siteFooter}"></div>
</body>
</html>
